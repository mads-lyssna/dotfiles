name: Build devcontainers Nix cache
on:
  push:
    branches: [main]
    paths:
      - flake.lock
      - flake.nix
      - home.nix
      - modules/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v14
      - name: Build and export vscode closure
        run: |
          out=$(nix build .#homeConfigurations.vscode.activationPackage --print-out-paths --no-link)
          nix-store --export $(nix-store --query --requisites "$out") | zstd -T0 -19 > devcontainers-closure.nar.zst
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: devcontainers-cache
          files: devcontainers-closure.nar.zst
          make_latest: false
